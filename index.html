<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ミニゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1 class="title">ミニゲーム</h1>
      <p class="subtitle">王コマを中央へ導け</p>
    </header>

    <main>
      <div id="loading" class="loading">読み込み中<span class="dots">...</span></div>

      <div id="game" class="game hidden">
                <div class="mode-row">
          <button class="mode-btn active" data-mode="pvp">2人で対戦</button>
          <button class="mode-btn" data-mode="easy">CPU 弱い</button>
          <button class="mode-btn" data-mode="normal">CPU 普通</button>
                    <button class="mode-btn" data-mode="hard">CPU 強い</button>
        </div>
        <div class="status-row">
          <span class="turn-chip" id="turn-chip"></span>
          <p id="status" class="status-text"></p>
        </div>

        <div id="board" class="board" aria-label="盤面"></div>

        <div class="controls">
          <div class="dpad">
            <button class="dpad-btn dpad-up" id="btn-up" aria-label="上へ" disabled>▲</button>
            <button class="dpad-btn dpad-left" id="btn-left" aria-label="左へ" disabled>◀</button>
            <div class="dpad-center">移動</div>
            <button class="dpad-btn dpad-right" id="btn-right" aria-label="右へ" disabled>▶</button>
            <button class="dpad-btn dpad-down" id="btn-down" aria-label="下へ" disabled>▼</button>
          </div>
          <button id="btn-reset" class="reset-btn">最初から</button>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <a href="RULES.md" target="_blank" rel="noopener">遊び方を見る</a>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script src="app.js"></script>
</body>
</html>
